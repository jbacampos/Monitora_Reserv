; ============================================================================
;  Monitora_Reserv - Etapa 2 (aquisicao, filtro, display, Wi-Fi e ThingsBoard)
;  Placa: NodeMCU ESP8266 (ESP-12E)
;  Sensor: QDY30A em A0 | Display: TM1637 (CLK=D1, DIO=D2) | Botao: D7
;
;  SELECAO DE AMBIENTE: exclusivamente include/config.h (TEST_MODE).
;  Nao ha -D de modo aqui nem em nenhum outro arquivo: os ambientes do
;  PlatformIO nao criam uma segunda chave de selecao TESTE/PRODUCAO.
; ============================================================================

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Fila offline em LittleFS (mesma configuracao do Ecowitt2TB).
; board_build.ldscript fixa 1 MB de LittleFS, suficiente para os 128 segmentos
; da fila. O sistema de arquivos NAO e formatado automaticamente pelo firmware:
; em uma placa nova, envie-o uma vez com `pio run -t uploadfs`.
;
; A pasta data/ existe apenas para o PlatformIO conseguir montar essa imagem:
; ela fica vazia (so o .gitkeep, que mantem o diretorio no Git) porque a fila
; cria /q-NNNNNNNN.seg e /q-seq-*.dat em tempo de execucao.
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld

lib_deps =
    ; Display de 6 digitos. O registro do PlatformIO ainda publica apenas a
    ; versao 1.1.0 (4 digitos), por isso a tag do repositorio, que inclui
    ; o cabecalho TM1637TinyDisplay6.h.
    https://github.com/jasonacox/TM1637TinyDisplay/archive/refs/tags/v1.12.2.zip
    ; MQTT usado pelo modulo thingsboard.
    knolleary/PubSubClient @ ^2.8
    ; JSON da Bot API do Telegram (versao fixada, decidida para o projeto).
    bblanchon/ArduinoJson @ 6.21.5

build_flags =
    -Wall
    -Wextra
    ; chat.id e update_id do Telegram precisam de 64 bits (grupos -100...).
    ; E o padrao do ArduinoJson em plataformas de 32 bits, fixado aqui para
    ; nao depender de deteccao automatica.
    -DARDUINOJSON_USE_LONG_LONG=1

; tools/host_test nao e compilado pelo PlatformIO (o firmware usa apenas src/).
